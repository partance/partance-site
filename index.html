<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>partance.tech</title>
  <meta name="description" content="partance.tech — site en construction.">
  <!-- Page de test : empêche Google de l'indexer. Supprime cette ligne le jour où le site doit être trouvé. -->
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f3efe6">
  <!-- Petite icône d'onglet (un écrou) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-8 -8 16 16'%3E%3Cpolygon points='7.5,0 3.75,6.5 -3.75,6.5 -7.5,0 -3.75,-6.5 3.75,-6.5' fill='%23c9a227'/%3E%3Ccircle r='2.6' fill='%2313263d'/%3E%3C/svg%3E">
  <style>
    /* ===== Couleurs : modifie ici pour changer tout le camion ===== */
    :root {
      --fond: #f3efe6;
      --encre: #13263d;
      --texte-doux: #5a6472;
      --bleu: #1f4e8c;        /* plaques de la cabine */
      --bleu-clair: #2b62a8;  /* déflecteur de toit */
      --bleu-bord: #163a69;
      --acier: #a9b3be;       /* bandes perforées */
      --acier-bord: #6d7884;
      --sombre: #4a525c;      /* pare-chocs */
      --jaune: #e9b525;       /* batteries */
      --jaune-bord: #b88a12;
      --laiton: #c9a227;      /* écrous */
      --laiton-bord: #8e7016;
      --trou: #1a1f27;
      --vitre: #cfe8f3;
      --route: #3b4048;
      --vert: #2f7d4f;        /* borne de recharge */
      --vert-bord: #1f5a37;
      --rouge: #b8322a;       /* satellite */
      --rouge-bord: #7d1f19;
      --signal: #2a9d8f;      /* liaisons entre les systèmes */
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px 24px;
      background-color: var(--fond);
      /* trame de petits trous, comme une plaque perforée */
      background-image: radial-gradient(#ddd5c5 1.3px, transparent 1.5px);
      background-size: 20px 20px;
      color: var(--encre);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    h1 span { color: var(--jaune-bord); }
    .accroche {
      margin: 12px 0 0;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--texte-doux);
    }
    figure { margin: 18px 0 0; width: min(100%, 900px); }
    svg { display: block; width: 100%; height: auto; }
    .legende { margin: 6px 0 0; font-size: 0.95rem; color: var(--texte-doux); }

    /* Bouton de contact, façon bande perforée avec deux écrous — en haut à droite, format réduit */
    .contact {
      position: absolute;
      top: 14px;
      right: 16px;
      margin: 0;
    }
    .contact a {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--acier);
      border: 1.5px solid var(--acier-bord);
      color: var(--encre);
      font-weight: 700;
      font-size: 0.65rem;
      letter-spacing: 0.01em;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }
    .contact a:hover { background: #c3ccd5; }
    .contact a:focus-visible { outline: 2px solid var(--jaune); outline-offset: 2px; }
    .contact svg { width: 9px; height: 9px; flex: none; }
    footer { margin-top: 28px; font-size: 0.8rem; color: #8a8f98; }

    /* ===== Styles des pièces du camion ===== */
    .plaque-bleue { fill: var(--bleu); stroke: var(--bleu-bord); stroke-width: 2; }
    .plaque-jaune { fill: var(--jaune); stroke: var(--jaune-bord); stroke-width: 2; }
    .plaque-verte { fill: var(--vert); stroke: var(--vert-bord); stroke-width: 2; }
    .plaque-rouge { fill: var(--rouge); stroke: var(--rouge-bord); stroke-width: 2; }
    .perfore { fill: url(#trous); }

    /* Une "bande" = un tracé dessiné 3 fois : bord, corps, puis trous */
    use.bord  { fill: none; stroke: var(--acier-bord); stroke-width: 22; stroke-linecap: round; }
    use.corps { fill: none; stroke: var(--acier); stroke-width: 20; stroke-linecap: round; }
    use.trous { fill: none; stroke: var(--trou); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 0.01 19.99; }
    use.corps.sombre { stroke: var(--sombre); }
    use.bord.sombre  { stroke: #2f353c; }
    use.bord.fine  { stroke-width: 14; }
    use.corps.fine { stroke-width: 12; }
    use.trous.fine { stroke-width: 5; stroke-dasharray: 0.01 15.99; }

    /* ===== Animations ===== */
    .tirets { animation: defile 0.5s linear infinite; }
    @keyframes defile { to { stroke-dashoffset: 50; } }
    .roue { transform-box: fill-box; transform-origin: center; animation: tourne 2.51s linear infinite; }
    @keyframes tourne { to { transform: rotate(360deg); } }
    .caisse { animation: cahot 0.45s ease-in-out infinite alternate; }
    @keyframes cahot { to { transform: translateY(-1.5px); } }
    /* Liaisons : des points qui circulent entre satellite, camion et borne */
    .lien { fill: none; stroke: var(--signal); stroke-width: 3.5; stroke-linecap: round;
            stroke-dasharray: 0.01 11.99; stroke-opacity: 0.85; animation: flux 1.2s linear infinite; }
    @keyframes flux { to { stroke-dashoffset: -24; } }
    .satellite { animation: flotte 3s ease-in-out infinite alternate; }
    @keyframes flotte { to { transform: translateY(-3px); } }
    .onde { fill: none; stroke: var(--signal); stroke-width: 2; stroke-linecap: round; animation: onde 1.6s ease-out infinite both; }
    .onde.o2 { animation-delay: 0.4s; }
    @keyframes onde { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
    .led { animation: clignote 1.2s steps(1) infinite; }
    @keyframes clignote { 50% { opacity: 0.25; } }
    .barre { animation: charge 2.4s linear infinite both; }
    .barre.b2 { animation-delay: 0.4s; }
    .barre.b3 { animation-delay: 0.8s; }
    @keyframes charge { 0%, 15% { opacity: 0.15; } 25%, 80% { opacity: 1; } 100% { opacity: 0.15; } }

    @media (prefers-reduced-motion: reduce) {
      .tirets, .roue, .caisse, .lien, .satellite, .onde, .led, .barre { animation: none; }
    }
  </style>
</head>
<body>

  <!-- Contact (en haut à droite) : l'adresse est assemblée par le petit script en bas de page,
       pour la cacher aux robots qui collectent les e-mails pour le spam. -->
  <p class="contact">
    <a id="lien-contact">
      <svg viewBox="-7 -7 14 14" aria-hidden="true"><polygon points="6,0 3,5.2 -3,5.2 -6,0 -3,-5.2 3,-5.2" fill="#c9a227" stroke="#8e7016" stroke-width="1"/><circle r="2.2" fill="#8e7016"/></svg>
      <span id="adresse-contact">contact [at] partance.tech</span>
      <svg viewBox="-7 -7 14 14" aria-hidden="true"><polygon points="6,0 3,5.2 -3,5.2 -6,0 -3,-5.2 3,-5.2" fill="#c9a227" stroke="#8e7016" stroke-width="1"/><circle r="2.2" fill="#8e7016"/></svg>
    </a>
  </p>

  <header>
    <!-- Texte principal : à modifier librement -->
    <h1>partance<span>.tech</span></h1>
    <p class="accroche">Site en construction</p>
  </header>

  <figure>
    <!-- aria-label : description lue par les lecteurs d'écran, sans infobulle au survol -->
    <svg viewBox="-10 -24 870 432" role="img" aria-label="Tracteur routier électrique en pièces métalliques perforées et boulons, relié à un satellite et à une borne de recharge solaire">

      <defs>
        <!-- Trame de trous pour les plaques (un trou tous les 20 px) -->
        <pattern id="trous" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="10" cy="10" r="3.4" fill="#1a1f27" fill-opacity="0.85"/>
        </pattern>

        <!-- Écrou en laiton -->
        <g id="ecrou">
          <polygon points="6,0 3,5.2 -3,5.2 -6,0 -3,-5.2 3,-5.2" fill="#c9a227" stroke="#8e7016" stroke-width="1"/>
          <circle r="2.2" fill="#8e7016"/>
        </g>

        <!-- Faisceau des phares -->
        <linearGradient id="faisceau" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#ffe9a6" stop-opacity="0.6"/>
          <stop offset="1" stop-color="#ffe9a6" stop-opacity="0"/>
        </linearGradient>

        <!-- Fondu de la route sur les bords -->
        <linearGradient id="fondu" gradientUnits="userSpaceOnUse" x1="-10" x2="860" y1="0" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/>
          <stop offset="0.08" stop-color="#fff" stop-opacity="1"/>
          <stop offset="0.92" stop-color="#fff" stop-opacity="1"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <mask id="masque-route">
          <rect x="-10" y="-24" width="870" height="432" fill="url(#fondu)"/>
        </mask>

        <!-- Tracés des bandes perforées (les trous tombent tous les 20 px) -->
        <g id="bandes-chassis">
          <path d="M190 290 H730"/>
        </g>
        <g id="bandes-avant">
          <path d="M570 110 H730"/>  <!-- toit -->
          <path d="M730 110 V270"/>  <!-- montant avant -->
          <path d="M570 210 H730"/>  <!-- ceinture de caisse -->
          <path d="M650 110 V210"/>  <!-- montant de porte -->
          <path d="M270 270 H330"/>  <!-- support de sellette -->
          <path d="M450 230 V290"/>  <!-- séparation des batteries -->
        </g>
        <g id="bandes-sombres">
          <path d="M690 290 H750"/>  <!-- pare-chocs -->
        </g>
        <g id="bandes-fines">
          <path d="M588 320 A52 52 0 0 1 692 320"/>  <!-- garde-boue avant -->
          <path d="M248 320 A52 52 0 0 1 274 275"/>  <!-- garde-boue arrière -->
        </g>

        <!-- Bandes de la borne de recharge -->
        <g id="mat-borne">
          <path d="M90 210 V150"/>   <!-- mât du panneau solaire -->
        </g>
        <g id="socle-borne">
          <path d="M50 350 H130"/>   <!-- socle -->
        </g>
        <!-- Bras du satellite (repère local du satellite) -->
        <g id="bras-sat">
          <path d="M-58 0 H58"/>
        </g>

        <!-- Une roue (centrée sur 0,0) -->
        <g id="roue">
          <circle r="40" fill="#23262b"/>
          <circle r="36" fill="none" stroke="#15171a" stroke-width="5" stroke-dasharray="5 4.425"/>
          <circle r="27" fill="#3a3f46"/>
          <circle r="22" fill="#c3ccd5" stroke="#8b96a3" stroke-width="1.5"/>
          <circle cx="13" cy="0" r="3.2" fill="#1a1f27"/>
          <circle cx="6.5" cy="11.26" r="3.2" fill="#1a1f27"/>
          <circle cx="-6.5" cy="11.26" r="3.2" fill="#1a1f27"/>
          <circle cx="-13" cy="0" r="3.2" fill="#1a1f27"/>
          <circle cx="-6.5" cy="-11.26" r="3.2" fill="#1a1f27"/>
          <circle cx="6.5" cy="-11.26" r="3.2" fill="#1a1f27"/>
          <use href="#ecrou" transform="scale(1.25)"/>
        </g>

        <!-- Éclair (symbole électrique) -->
        <path id="eclair" d="M2 -13 L-8 2 L-1 2 L-3 13 L8 -3 L1 -3 Z"/>
      </defs>

      <!-- ===== Route ===== -->
      <g mask="url(#masque-route)">
        <rect x="-20" y="360" width="920" height="38" fill="#3b4048"/>
        <rect x="-20" y="360" width="920" height="4" fill="#2c3036"/>
        <path class="tirets" d="M-20 381 H900" stroke="#f3efe6" stroke-width="3" stroke-dasharray="26 24"/>
      </g>
      <ellipse cx="470" cy="362" rx="320" ry="6" fill="#000" fill-opacity="0.18"/>
      <!-- Ombre de la borne (remontée avec elle) -->
      <ellipse cx="92" cy="346" rx="48" ry="4" fill="#000" fill-opacity="0.18"/>

      <!-- ===== Liaisons du système de systèmes (données et énergie) ===== -->
      <path class="lien" d="M334 44 Q500 14 640 56"/>   <!-- satellite → camion -->
      <path class="lien" d="M326 44 Q200 70 90 125"/>   <!-- satellite → borne -->
      <path class="lien" d="M90 235 Q240 200 380 240"/> <!-- borne → batteries du camion -->

      <!-- ===== Borne de recharge avec panneau solaire ===== -->
      <!-- Remontée de 15 px pour qu'elle soit posée à côté de la route, pas dessus.
           Change le -15 pour ajuster la hauteur. -->
      <g transform="translate(0 -15)">
        <!-- Mât -->
        <use href="#mat-borne" class="bord"/>
        <use href="#mat-borne" class="corps"/>
        <use href="#mat-borne" class="trous"/>

        <!-- Panneau solaire, incliné vers le soleil -->
        <g transform="rotate(-12 90 140)">
          <rect x="34" y="126" width="112" height="26" rx="3" fill="#a9b3be" stroke="#6d7884" stroke-width="1.5"/>
          <rect x="38" y="130" width="104" height="18" fill="#1d3a63"/>
          <path d="M51 130V148 M64 130V148 M77 130V148 M90 130V148 M103 130V148 M116 130V148 M129 130V148 M38 139H142"
                stroke="#4f7db3" stroke-width="1.2"/>
          <polygon points="58,130 68,130 62,148 52,148" fill="#fff" fill-opacity="0.18"/>
        </g>

        <!-- Câble de recharge (orange = haute tension) -->
        <path d="M126 268 C150 292 148 336 112 334" fill="none" stroke="#e8761c" stroke-width="5" stroke-linecap="round"/>

        <!-- Caisson de la borne -->
        <rect x="60" y="220" width="60" height="124" rx="4" class="plaque-verte"/>
        <rect x="60" y="220" width="60" height="124" rx="4" class="perfore"/>

        <!-- Écran avec jauge de charge -->
        <rect x="66" y="236" width="48" height="28" rx="4" fill="#13263d"/>
        <rect x="78" y="243" width="21" height="14" rx="2" fill="none" stroke="#e9eef3" stroke-width="1.5"/>
        <rect x="99.5" y="247" width="3" height="6" rx="1" fill="#e9eef3"/>
        <rect class="barre" x="80.5" y="245.5" width="4.5" height="9" fill="#7fd18b"/>
        <rect class="barre b2" x="86.25" y="245.5" width="4.5" height="9" fill="#7fd18b"/>
        <rect class="barre b3" x="92" y="245.5" width="4.5" height="9" fill="#7fd18b"/>

        <!-- Éclair -->
        <rect x="78" y="278" width="24" height="24" rx="6" fill="#13263d"/>
        <use href="#eclair" transform="translate(90 290) scale(0.75)" fill="#e9b525"/>

        <!-- Pistolet de recharge dans son support -->
        <rect x="119" y="250" width="9" height="24" rx="2" fill="#20252c"/>
        <rect x="121" y="254" width="12" height="16" rx="3" fill="#3a3f46" stroke="#20252c" stroke-width="1"/>

        <!-- Socle -->
        <use href="#socle-borne" class="bord sombre"/>
        <use href="#socle-borne" class="corps sombre"/>
        <use href="#socle-borne" class="trous"/>

        <!-- Écrous -->
        <use href="#ecrou" x="70" y="230"/>
        <use href="#ecrou" x="110" y="230"/>
        <use href="#ecrou" x="70" y="330"/>
        <use href="#ecrou" x="110" y="330"/>
        <use href="#ecrou" x="90" y="170"/>
        <use href="#ecrou" x="50" y="350"/>
        <use href="#ecrou" x="130" y="350"/>
      </g>

      <!-- ===== Satellite ===== -->
      <g transform="translate(330 6) rotate(-6)">
        <g class="satellite">
          <!-- Bras -->
          <use href="#bras-sat" class="bord fine"/>
          <use href="#bras-sat" class="corps fine"/>
          <use href="#bras-sat" class="trous fine"/>

          <!-- Panneaux solaires -->
          <rect x="-82" y="-13" width="52" height="26" rx="2" fill="#a9b3be" stroke="#6d7884" stroke-width="1.5"/>
          <rect x="-79" y="-10" width="46" height="20" fill="#1d3a63"/>
          <path d="M-67.5 -10V10 M-56 -10V10 M-44.5 -10V10 M-79 0H-33" stroke="#4f7db3" stroke-width="1.2"/>
          <rect x="30" y="-13" width="52" height="26" rx="2" fill="#a9b3be" stroke="#6d7884" stroke-width="1.5"/>
          <rect x="33" y="-10" width="46" height="20" fill="#1d3a63"/>
          <path d="M44.5 -10V10 M56 -10V10 M67.5 -10V10 M33 0H79" stroke="#4f7db3" stroke-width="1.2"/>

          <!-- Antenne parabolique -->
          <path d="M0 14V27" stroke="#8b96a3" stroke-width="3"/>
          <path d="M-13 33 Q0 19 13 33 Z" fill="#dfe5ea" stroke="#8b96a3" stroke-width="1.5"/>
          <path d="M0 27V37" stroke="#8b96a3" stroke-width="1.5"/>
          <circle class="led" cx="0" cy="38" r="2.4" fill="#ff5a4f"/>

          <!-- Corps -->
          <rect x="-18" y="-16" width="36" height="32" rx="3" class="plaque-rouge"/>
          <rect x="-18" y="-16" width="36" height="32" rx="3" class="perfore"/>
          <use href="#ecrou" x="-10" y="-10"/>
          <use href="#ecrou" x="10" y="10"/>

          <!-- Ondes radio -->
          <path class="onde" d="M-7 45 Q0 50 7 45"/>
          <path class="onde o2" d="M-12 51 Q0 59 12 51"/>
        </g>
      </g>

      <!-- Faisceau des phares -->
      <polygon points="738,244 900,212 900,300 738,256" fill="url(#faisceau)"/>

      <!-- ===== Caisse du camion (tout sauf les roues) ===== -->
      <g class="caisse">

        <!-- Châssis -->
        <use href="#bandes-chassis" class="bord"/>
        <use href="#bandes-chassis" class="corps"/>
        <use href="#bandes-chassis" class="trous"/>

        <!-- Sellette (où s'accroche la semi-remorque) -->
        <path d="M252 262 H348 L342 249 H258 Z" fill="#5d6772" stroke="#3e464f" stroke-width="2"/>

        <!-- Pack batteries -->
        <rect x="360" y="220" width="180" height="80" rx="4" class="plaque-jaune"/>
        <rect x="360" y="220" width="180" height="80" rx="4" class="perfore"/>
        <rect x="387" y="242" width="36" height="36" rx="6" fill="#13263d"/>
        <rect x="477" y="242" width="36" height="36" rx="6" fill="#13263d"/>
        <use href="#eclair" x="405" y="260" fill="#e9b525"/>
        <use href="#eclair" x="495" y="260" fill="#e9b525"/>

        <!-- Câble haute tension (orange, comme sur les vrais véhicules électriques) -->
        <path d="M534 246 C556 236 548 272 572 262" fill="none" stroke="#e8761c" stroke-width="5" stroke-linecap="round"/>

        <!-- Déflecteur de toit (l'aérodynamique compte !) -->
        <path d="M560 100 L560 58 Q652 50 742 100 Z" fill="#2b62a8" stroke="#163a69" stroke-width="2" stroke-linejoin="round"/>
        <path d="M578 70 Q650 64 716 96" fill="none" stroke="#1a1f27" stroke-opacity="0.85" stroke-width="6.5" stroke-linecap="round" stroke-dasharray="0.01 19.99"/>

        <!-- Antenne GPS / télématique sur le toit (reçoit le satellite) -->
        <path d="M630 60.5 Q640 47 650 64 Z" fill="#20252c"/>

        <!-- Cabine : plaque bleue en L + vitre -->
        <path d="M566 100 H640 V200 H734 Q740 200 740 206 V274 Q740 280 734 280 H566 Q560 280 560 274 V106 Q560 100 566 100 Z" class="plaque-bleue"/>
        <path d="M566 100 H640 V200 H734 Q740 200 740 206 V274 Q740 280 734 280 H566 Q560 280 560 274 V106 Q560 100 566 100 Z" class="perfore"/>
        <rect x="642" y="106" width="86" height="100" fill="#cfe8f3"/>
        <polygon points="676,118 694,118 672,202 654,202" fill="#fff" fill-opacity="0.5"/>

        <!-- Plaque de marque -->
        <rect x="566" y="141" width="68" height="18" rx="3" fill="#0f2238"/>
        <text x="600" y="154" font-size="10.5" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#e9eef3"
              font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Arial, sans-serif">partance</text>

        <!-- Porte : joint et poignée -->
        <path d="M641 220 V279" stroke="#0f2238" stroke-opacity="0.6" stroke-width="1.5"/>
        <rect x="664" y="233" width="18" height="5" rx="2.5" fill="#0f2238"/>

        <!-- Bandes perforées (cadre de cabine, sellette, batteries) -->
        <use href="#bandes-avant" class="bord"/>
        <use href="#bandes-avant" class="corps"/>
        <use href="#bandes-avant" class="trous"/>

        <!-- Pare-chocs -->
        <use href="#bandes-sombres" class="bord sombre"/>
        <use href="#bandes-sombres" class="corps sombre"/>
        <use href="#bandes-sombres" class="trous"/>

        <!-- Garde-boue -->
        <use href="#bandes-fines" class="bord fine"/>
        <use href="#bandes-fines" class="corps fine"/>
        <use href="#bandes-fines" class="trous fine"/>

        <!-- Phare -->
        <circle cx="730" cy="250" r="13" fill="#ffe9a6" fill-opacity="0.35"/>
        <circle cx="730" cy="250" r="7" fill="#fff6d2" stroke="#d8b24a" stroke-width="1.5"/>

        <!-- Rétroviseur caméra (moins de traînée qu'un rétroviseur classique) -->
        <path d="M738 140 L763 154" stroke="#8f9aa6" stroke-width="5" stroke-linecap="round"/>
        <rect x="757" y="149" width="19" height="11" rx="3" fill="#20252c"/>
        <circle cx="772" cy="154.5" r="2" fill="#6fb3d9"/>

        <!-- Écrous aux points d'assemblage -->
        <use href="#ecrou" x="190" y="290"/>
        <use href="#ecrou" x="250" y="290"/>
        <use href="#ecrou" x="730" y="290"/>
        <use href="#ecrou" x="750" y="290"/>
        <use href="#ecrou" x="270" y="270"/>
        <use href="#ecrou" x="330" y="270"/>
        <use href="#ecrou" x="370" y="230"/>
        <use href="#ecrou" x="530" y="230"/>
        <use href="#ecrou" x="370" y="290"/>
        <use href="#ecrou" x="530" y="290"/>
        <use href="#ecrou" x="450" y="230"/>
        <use href="#ecrou" x="450" y="290"/>
